[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pow"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "Proof of Work protection for Django views to stop bots and credential stuffing."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "django>=3.2",
]

[project.urls]
"Homepage" = "https://github.com/hehenischal/django-pow"
"Bug Tracker" = "https://github.com/hehenischal/django-pow/issues"